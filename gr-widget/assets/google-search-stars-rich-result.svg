<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="serpTitle serpDesc">
  <title id="serpTitle">Star rating in Google results</title>
  <desc id="serpDesc">Headline and stars centered in the left column; two organic Google-result cards on the right with a Your Business listing, gold stars, and a Google G badge.</desc>
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.14"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#0f172a" flood-opacity="0.16"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="goldStar">
      <path d="M12 1.7l2.9 6.05 6.65.95-4.82 4.64 1.15 6.62L12 16.9l-5.88 3.16 1.15-6.62L2.45 8.7l6.65-.95z" fill="#F4B400"/>
    </g>
    <g id="emptyStar">
      <path d="M12 1.7l2.9 6.05 6.65.95-4.82 4.64 1.15 6.62L12 16.9l-5.88 3.16 1.15-6.62L2.45 8.7l6.65-.95z" fill="#D9DDE2"/>
    </g>
    <clipPath id="starHalf">
      <rect x="0" y="0" width="12" height="24"/>
    </clipPath>
    <g id="resultCard">
      <rect width="430" height="196" rx="22" fill="#ffffff"/>
      <circle cx="40" cy="38" r="16" fill="#111111"/>
      <text x="40" y="44" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Y</text>
      <text x="66" y="34" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Your Business</text>
      <text x="66" y="52" fill="#70757A" font-family="Arial,Helvetica,sans-serif" font-size="11">www.yourbusiness.com</text>
      <rect x="24" y="110" width="150" height="11" rx="5.5" fill="#E8EAED"/>
      <rect x="182" y="110" width="118" height="11" rx="5.5" fill="#E8EAED"/>
      <rect x="24" y="130" width="300" height="11" rx="5.5" fill="#E8EAED"/>
      <g transform="translate(24,154) scale(0.95)">
        <use href="#goldStar"/>
        <use href="#goldStar" x="24"/>
        <use href="#goldStar" x="48"/>
        <use href="#goldStar" x="72"/>
        <use href="#goldStar" x="96"/>
      </g>
    </g>
    <g id="googleG" transform="translate(-12,-12)">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="#F4F7F9"/>

  <!-- Left headline: centered in the empty column (x=0–488) -->
  <g transform="translate(244,252)">
    <text x="0" y="-72" text-anchor="middle" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Star rating</text>
    <text x="0" y="-20" text-anchor="middle" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">in Google</text>
    <text x="0" y="32" text-anchor="middle" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">results</text>
    <g transform="translate(-99,56) scale(1.55)">
      <use href="#goldStar"/>
      <use href="#goldStar" x="26"/>
      <use href="#goldStar" x="52"/>
      <use href="#goldStar" x="78"/>
      <g transform="translate(104,0)">
        <use href="#emptyStar"/>
        <g clip-path="url(#starHalf)">
          <use href="#goldStar"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Top card -->
  <g filter="url(#cardShadow)" transform="translate(488,58)">
    <use href="#resultCard"/>
    <text x="24" y="92" fill="#1A0DAB" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Your Business</text>
  </g>
  <text x="636" y="234" fill="#5F6368" font-family="Arial,Helvetica,sans-serif" font-size="13">Rating 5.0</text>

  <!-- Bottom card -->
  <g filter="url(#cardShadow)" transform="translate(488,286)">
    <use href="#resultCard"/>
    <text x="24" y="92" fill="#1A0DAB" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Your Product - Your Business</text>
  </g>
  <text x="636" y="462" fill="#5F6368" font-family="Arial,Helvetica,sans-serif" font-size="13">Rating 4.7</text>

  <!-- Google G badge overlapping top card -->
  <g filter="url(#gShadow)" transform="translate(878,52)">
    <circle r="30" fill="#ffffff"/>
    <g transform="scale(1.85)">
      <use href="#googleG"/>
    </g>
  </g>
</svg>
